[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoipgen"
version = "1.0.0"
description = "Generator of valid IPv4 addresses by country"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
keywords = ["ip", "ipv4", "cidr", "subnet", "geoip", "country"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/prizrak2033/geoipgen"
Issues = "https://github.com/prizrak2033/geoipgen/issues"

[tool.setuptools.packages.find]
include = ["geoipgen*"]

[tool.setuptools.package-data]
geoipgen = ["ipv4/*.cidr", "py.typed"]
