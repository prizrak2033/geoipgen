[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoipgen"
version = "1.0.0"
description = "Generator of valid IPv4 addresses by country"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.7"
keywords = ["ip", "ipv4", "cidr", "subnet", "geoip", "country"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/prizrak2033/geoipgen"

[tool.setuptools.packages.find]
include = ["geoipgen*"]

[tool.setuptools.package-data]
geoipgen = ["ipv4/*.cidr"]
