name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
      - name: Install the package and import it from outside the repo
        run: |
          python -m pip install --quiet .
          cd /
          python -c "
          import geoipgen
          assert geoipgen.countries(), 'no country data packaged'
          assert geoipgen.countryOf('8.8.8.8') == 'us'
          assert geoipgen.randomIP('es')
          print('packaged data resolves outside the repo')
          "

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet mypy
      - run: python -m mypy geoipgen/ --strict

  data:
    name: data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every shipped block parses, is aligned, and is disjoint
        run: |
          python - <<'PY'
          import ipaddress
          import geoipgen

          spans = []
          for code in geoipgen.countries():
              blocks = geoipgen.cidrs(code)
              assert blocks, f"{code} has no blocks"
              for block in blocks:
                  net = ipaddress.ip_network(block, strict=True)
                  spans.append((int(net.network_address), int(net.broadcast_address), block))
          spans.sort()
          for earlier, later in zip(spans, spans[1:]):
              assert earlier[1] < later[0], f"overlap: {earlier[2]} and {later[2]}"
          print(f"{len(spans)} blocks: all aligned, all disjoint")
          PY
